services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
    networks:
      - islamic_app_network

  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - islamic_app_network

  redis:
    image: redis:alpine
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - islamic_app_network

networks:
  islamic_app_network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
